<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<meta name="description" content="12일 교대근무의 수면·식사·운동·일정을 한곳에서 관리하는 개인용 앱">
<title>RHYTHM · 오늘의 리듬</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10m6 10V4m5 16v-8m5 8V7"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="var(--bg)"/><circle cx="16" cy="12" r="2" fill="var(--bg)"/><circle cx="8" cy="18" r="2" fill="var(--bg)"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-food" viewBox="0 0 24 24"><path d="M4 3v8a3 3 0 0 0 6 0V3M7 3v18M18 21V3c-4 3-5 9-5 13h5"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 5 4 4M4 20l5-.8L20 8a2.2 2.2 0 0 0-4-4L5 15Z"/></symbol>
  <symbol id="i-bin" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6m4-6v6"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 17V5m-4 4 4-4 4 4M4 17v4h16v-4"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="m7 4 13 8-13 8Z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 21h20Z"/><path d="M12 9v5m0 3h.01"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="m12 2 2.3 7.7L22 12l-7.7 2.3L12 22l-2.3-7.7L2 12l7.7-2.3Z"/></symbol>
</svg>
<div class="shell" id="shell">
  <header class="brand-header">
    <div class="brandline"><div class="mark"><svg class="icon"><use href="#i-moon"/></svg></div><div><div class="brand-title">RHYTHM <span class="version">v2</span></div><div class="brand-caption">내 생활의 리듬</div></div></div>
    <div class="brand-right"><button class="quiet-icon" id="themeShortcut" type="button" aria-label="테마 변경"><svg class="icon"><use href="#i-sun"/></svg></button></div>
  </header>
  <div class="date-sticky" id="dateSticky">
    <div class="date-line">
      <div><div class="date-eyebrow" id="dateEyebrow">오늘의 일정</div><strong id="dateDisplay" class="date-display"></strong></div>
      <div class="date-buttons">
        <button class="square-button" type="button" id="datePrev" aria-label="전날"><svg class="icon"><use href="#i-chevron-left"/></svg></button>
        <button class="date-today" id="dateToday" type="button">오늘</button>
        <button class="square-button" type="button" id="dateNext" aria-label="다음 날"><svg class="icon"><use href="#i-chevron-right"/></svg></button>
      </div>
    </div>
    <div class="phase-scroll" id="phaseStrip" aria-label="12일 근무 주기"></div>
  </div>
  <main id="main" class="main-content">
    <section id="view-home" class="view"></section>
    <section id="view-calendar" class="view hidden"></section>
    <section id="view-stats" class="view hidden"></section>
    <section id="view-routine" class="view hidden"></section>
    <section id="view-settings" class="view hidden"></section>
  </main>
  <button id="fab" type="button" class="fab" aria-label="새 일정 추가"><svg class="icon"><use href="#i-plus"/></svg></button>
  <nav class="bottom-nav" aria-label="기본 메뉴">
    <button data-tab="home" type="button" class="nav-item active"><svg class="icon"><use href="#i-home"/></svg><span>오늘</span></button>
    <button data-tab="calendar" type="button" class="nav-item"><svg class="icon"><use href="#i-calendar"/></svg><span>달력</span></button>
    <button data-tab="stats" type="button" class="nav-item"><svg class="icon"><use href="#i-chart"/></svg><span>통계</span></button>
    <button data-tab="routine" type="button" class="nav-item"><svg class="icon"><use href="#i-repeat"/></svg><span>루틴</span></button>
    <button data-tab="settings" type="button" class="nav-item"><svg class="icon"><use href="#i-settings"/></svg><span>설정</span></button>
  </nav>
</div>
<div class="sheet-backdrop" id="sheet" aria-hidden="true"><section class="sheet-panel" role="dialog" aria-modal="true" aria-label="입력 창"><div class="sheet-handle"></div><div class="sheet-body" id="sheetBody"></div></section></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input id="importFile" type="file" accept="application/json,.json" hidden>
<script src="./core.js"></script>
<script src="./app.js" defer></script>
</body>
</html>
